[workspace]
resolver = "2"
members = ["crates/satlas-core", "crates/satlas-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/anirudhpatwal/satlas"

[workspace.dependencies]
miniscript = { version = "13", features = ["serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Small, fast WASM output.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
